spring.application.name=ZonaFit
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/zonafit?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=2000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Validaciones
spring.jpa.properties.hibernate.validator.apply_to_ddl=true
spring.jpa.properties.hibernate.validator.autoregister_listeners=true

# JWT Configuration
jwt.secret=Q2xhdmVTZWNyZXRhUGFyYVpvbmFGaXQxMjM0NTY3ODk
jwt.expiration=86400000
jwt.issuer=zonafit-api


# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

